---
- name: Configure device credentials on Cisco Catalyst Center
  hosts: localhost
  vars_files:
    - "credentials.yml"
  connection: local
  gather_facts: no
  tasks:
    - name: assurance settings
      cisco.dnac.assurance_settings_workflow_manager_with_issue_resolve:
        dnac_host: "{{dnac_host}}"
        dnac_username: "{{dnac_username}}"
        dnac_password: "{{dnac_password}}"
        dnac_verify: "{{dnac_verify}}"
        dnac_port: "{{dnac_port}}"
        dnac_version: "{{dnac_version}}"
        dnac_debug: "{{dnac_debug}}"
        dnac_log: True
        dnac_log_level: DEBUG
        dnac_api_task_timeout: 1000
        dnac_task_poll_interval: 1
        state: merged
        config_verify: True
        config:
          - assurance_user_defined_issue_settings:
            - name: deluluu12344678yughhj222
              description: testing settings 1
              rules:
                - severity: 5
                  facility: redundancy
                  mnemonic: peer monitor event
                  pattern: issue test
                  occurrences: 1
                  duration_in_minutes: 2
              is_enabled: true
              priority: P1
              is_notification_enabled: false
